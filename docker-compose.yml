services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notty
      POSTGRES_USER: notty
      POSTGRES_PASSWORD: notty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notty -d notty"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${NOTTY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NOTTY_BACKEND_PORT:-8080}:8080"
    environment:
      NOTTY_PORT: "8080"
      NOTTY_DATABASE_URL: postgres://notty:notty@postgres:5432/notty?sslmode=disable
      NOTTY_PPROF_ADDR: 127.0.0.1:6061
      NOTTY_JWT_SECRET: dev-notty-jwt-secret-change-me

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
      - static
    ports:
      - "127.0.0.1:${NOTTY_FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-${NOTTY_FRONTEND_ORIGIN:-http://localhost:${NOTTY_FRONTEND_PORT:-5173}}}
      VITE_API_BASE: ${VITE_API_BASE:-${NOTTY_BACKEND_ORIGIN:-http://localhost:${NOTTY_BACKEND_PORT:-8080}}}
      VITE_DAEMON_STATIC_BASE: ${VITE_DAEMON_STATIC_BASE:-${NOTTY_DAEMON_STATIC_BASE:-${NOTTY_STATIC_ORIGIN:-http://localhost:${NOTTY_STATIC_PORT:-5174}}/daemons}}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "npm ci && npm run dev"

  static:
    image: python:3.12-alpine
    ports:
      - "127.0.0.1:${NOTTY_STATIC_PORT:-5174}:8000"
    volumes:
      - ./deploy/daemons:/srv/static/daemons:ro
    command: python -m http.server 8000 --directory /srv/static

  daemon:
    profiles: ["daemon"]
    build:
      context: .
      dockerfile: daemon/Dockerfile
    depends_on:
      - backend
    environment:
      NOTTY_BACKEND_URL: http://backend:8080
      NOTTY_WORKSPACE_ID: ${NOTTY_WORKSPACE_ID:-}
      NOTTY_DAEMON_TOKEN: ${NOTTY_DAEMON_TOKEN:-}
      NOTTY_WORKSPACE_DIR: /workspace/notty/${NOTTY_WORKSPACE_ID:-default}
      NOTTY_AGENT_WORKSPACE_ROOT: /workspace/agents/${NOTTY_WORKSPACE_ID:-default}
      NOTTY_AGENT_ID: daemon_agent
      NOTTY_RUNTIME_DIR: /runtime/notty
      NOTTY_PPROF_ADDR: 127.0.0.1:6060
    volumes:
      - daemon_workspace:/workspace
      - daemon_runtime:/runtime
      - ${HOME}/.codex:/root/.codex

volumes:
  postgres_data:
  frontend_node_modules:
  daemon_workspace:
  daemon_runtime:
