services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notty
      POSTGRES_USER: notty
      POSTGRES_PASSWORD: notty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notty -d notty"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${NOTTY_BACKEND_PORT:-8080}:8080"
    environment:
      NOTTY_PORT: "8080"
      NOTTY_DATABASE_URL: postgres://notty:notty@postgres:5432/notty?sslmode=disable
      NOTTY_PPROF_ADDR: 127.0.0.1:6061
      NOTTY_JWT_SECRET: dev-notty-jwt-secret-change-me

  daemon:
    profiles: ["daemon"]
    build:
      context: .
      dockerfile: daemon/Dockerfile
    depends_on:
      - backend
    environment:
      NOTTY_BACKEND_URL: http://backend:8080
      NOTTY_WORKSPACE_ID: ${NOTTY_WORKSPACE_ID:-}
      NOTTY_DAEMON_TOKEN: ${NOTTY_DAEMON_TOKEN:-}
      NOTTY_WORKSPACE_DIR: /workspace/notty/${NOTTY_WORKSPACE_ID:-default}
      NOTTY_AGENT_WORKSPACE_ROOT: /workspace/agents/${NOTTY_WORKSPACE_ID:-default}
      NOTTY_AGENT_ID: daemon_agent
      NOTTY_RUNTIME_DIR: /runtime/notty
      NOTTY_PPROF_ADDR: 127.0.0.1:6060
    volumes:
      - daemon_workspace:/workspace
      - daemon_runtime:/runtime
      - ${HOME}/.codex:/root/.codex

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_PUBLIC_ORIGIN: ${NOTTY_PUBLIC_ORIGIN:-https://app.nottyai.co}
        VITE_API_BASE: ${NOTTY_API_BASE:-}
        VITE_DAEMON_STATIC_BASE: ${NOTTY_DAEMON_STATIC_BASE:-}
    depends_on:
      - backend
    expose:
      - "5173"
    ports:
      - "127.0.0.1:${NOTTY_FRONTEND_PORT:-5173}:5173"
    environment:
      NOTTY_VITE_BACKEND_PROXY_TARGET: http://backend:8080
      NOTTY_VITE_STATIC_PROXY_TARGET: http://nginx

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "${NOTTY_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/notty-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./homepage:/var/www/notty/homepage:ro
      - ./deploy/daemons:/var/www/notty/daemon-install:ro
      - ./dist/daemons:/var/www/notty/daemon-artifacts:ro

volumes:
  postgres_data:
  daemon_workspace:
  daemon_runtime:
