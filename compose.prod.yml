services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NOTTY_HTTP_BIND:-0.0.0.0}:${NOTTY_HTTP_PORT:-80}:80"
      - "${NOTTY_HTTPS_BIND:-0.0.0.0}:${NOTTY_HTTPS_PORT:-443}:443"
    volumes:
      - ./notty-api.nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # api.nottyai.co (legacy) TLS material.
      - type: bind
        source: /opt/notty/cert.pem
        target: /opt/notty/cert.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/notty/private.pem
        target: /opt/notty/private.pem
        read_only: true
        bind:
          create_host_path: false
      # api.getcodesk.com (current) TLS material.
      - type: bind
        source: /opt/notty/codesk_origin.pem
        target: /opt/notty/codesk_origin.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /opt/notty/codesk_private.pem
        target: /opt/notty/codesk_private.pem
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate --header='Host: ${NOTTY_API_HOST:-api.getcodesk.com}' https://127.0.0.1/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    image: ${NOTTY_BACKEND_IMAGE:-alphatoad/notty:backend-latest}
    restart: unless-stopped
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NOTTY_PORT: "8080"
      NOTTY_DATABASE_URL: ${NOTTY_DATABASE_URL:?NOTTY_DATABASE_URL is required}
      NOTTY_JWT_SECRET: ${NOTTY_JWT_SECRET:?NOTTY_JWT_SECRET is required}
      NOTTY_PUBLIC_ORIGIN: ${NOTTY_PUBLIC_ORIGIN:-https://app.getcodesk.com}
      NOTTY_PPROF_ADDR: ${NOTTY_PPROF_ADDR:-}
      NOTTY_MAILGUN_DOMAIN: ${NOTTY_MAILGUN_DOMAIN:?NOTTY_MAILGUN_DOMAIN is required}
      NOTTY_MAILGUN_API_KEY: ${NOTTY_MAILGUN_API_KEY:?NOTTY_MAILGUN_API_KEY is required}
      NOTTY_MAILGUN_FROM: ${NOTTY_MAILGUN_FROM:?NOTTY_MAILGUN_FROM is required}
      NOTTY_REQUIRE_EMAIL: ${NOTTY_REQUIRE_EMAIL:-1}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
