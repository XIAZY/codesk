<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/desktopHandoffSpike.css" />
    <title>Codesk Desktop connected</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="/app-icon.svg" width="32" height="32" alt="" />
        <span>Codesk</span>
      </div>
      <span class="environment">Desktop handoff spike</span>
    </header>
    <main>
      <section class="heading" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Native connection</p>
          <h1 id="page-title">Codesk Desktop is connected</h1>
        </div>
        <span class="status-chip" data-state="ready">Connected</span>
      </section>

      <section class="state-view" aria-live="polite">
        <h2>Connection complete</h2>
        <p>You can close this tab and return to Codesk Desktop.</p>
      </section>
    </main>
  </body>
</html>
