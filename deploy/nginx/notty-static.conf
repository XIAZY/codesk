server {
    listen 80;
    server_name _;

    root /var/www/notty-static;

    location = /daemons/install.sh {
        add_header Cache-Control "public, max-age=300";
        default_type text/x-shellscript;
        try_files /daemons/install.sh =404;
    }

    location /daemons/latest/ {
        add_header Cache-Control "public, max-age=60";
        try_files $uri =404;
    }

    location ~ ^/daemons/v[^/]+/.*\.(tar\.gz|json|txt)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /daemons/ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
}
