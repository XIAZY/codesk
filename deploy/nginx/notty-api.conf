map $http_upgrade $notty_connection_upgrade {
    default upgrade;
    "" close;
}

map $http_origin $notty_cors_origin {
    default "";
    "${NOTTY_FRONTEND_ORIGIN}" $http_origin;
    "${NOTTY_HOMEPAGE_ORIGIN}" $http_origin;
    "${NOTTY_WWW_HOMEPAGE_ORIGIN}" $http_origin;
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
}

server {
    listen 80;
    server_name ${NOTTY_API_HOST};

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    client_max_body_size 50m;
    server_name ${NOTTY_API_HOST};

    ssl_certificate ${NOTTY_TLS_CERT_FILE};
    ssl_certificate_key ${NOTTY_TLS_KEY_FILE};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:NOTTYSSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header Access-Control-Allow-Origin $notty_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Notty-Acting-Agent-ID, X-Requested-With" always;
    add_header Access-Control-Max-Age "86400" always;
    add_header Vary "Origin" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /healthz {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://backend:8080;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $notty_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Backend keeps permissive CORS for direct local development. Production
        # nginx owns browser-facing CORS, so hide upstream CORS to avoid duplicate
        # Access-Control-* response headers.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_hide_header Vary;

        proxy_pass http://backend:8080;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate ${NOTTY_TLS_CERT_FILE};
    ssl_certificate_key ${NOTTY_TLS_KEY_FILE};
    return 444;
}
