upstream notty_backend {
    server backend:8080;
}

upstream notty_frontend {
    server frontend:5173;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name nottyai.co www.nottyai.co;

    root /var/www/notty/homepage;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name app.nottyai.co;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /daemons/install.sh {
        alias /var/www/notty/daemon-install/install.sh;
        default_type text/x-shellscript;
        add_header Cache-Control "public, max-age=300";
    }

    location /daemons/ {
        alias /var/www/notty/daemon-artifacts/;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://notty_backend;
    }

    location /healthz {
        proxy_pass http://notty_backend;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://notty_backend;
    }

    location / {
        proxy_pass http://notty_frontend;
    }
}

server {
    listen 80;
    server_name api.nottyai.co;

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /daemons/install.sh {
        alias /var/www/notty/daemon-install/install.sh;
        default_type text/x-shellscript;
        add_header Cache-Control "public, max-age=300";
    }

    location /daemons/ {
        alias /var/www/notty/daemon-artifacts/;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://notty_backend;
    }

    location /healthz {
        proxy_pass http://notty_backend;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://notty_backend;
    }

    location / {
        proxy_pass http://notty_frontend;
    }
}
