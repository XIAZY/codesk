# Nightly (and on-demand) docker-compose E2E regression suite — the fs<->DB<->daemon sync tests in
# test/regression/sync_regression_test.go, whose convergence deadlines race under a loaded per-PR CI
# runner (a timing flake, not a code bug). Kept OUT of the required per-PR gate so it can't stop it
# being trustworthy, but run every day so failures land in front of us instead of nowhere. When
# Deniz's CI-facing deadline hardening lands (NOTTY_REGRESSION_DEADLINE_SCALE / retry-until-converge),
# this suite is promoted back into the required gate in .github/workflows/ci.yml.
name: Regression E2E (nightly)

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: regression-e2e-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regression-e2e:
    name: docker-compose fs<->DB<->daemon sync regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # third_party/y-crdt is a submodule; build-yffi needs its source
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo + libyrs build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            third_party/y-crdt/target
          key: yffi-${{ runner.os }}-${{ hashFiles('third_party/y-crdt/**/Cargo.lock') }}
          restore-keys: |
            yffi-${{ runner.os }}-
      - name: Build libyrs (cgo dependency)
        run: scripts/build-yffi.sh
      # The suite brings up its own postgres + backend via docker compose (test/regression/
      # docker-compose.yml), so no GitHub Postgres service is needed here.
      - name: Full regression suite (docker-compose E2E)
        run: go test -tags=regression -count=1 ./test/regression
