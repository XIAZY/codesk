# CI — encodes the manual gate ritual this team ran by hand, so the quality bar is infrastructure
# rather than social convention.
#
# Gate -> job map (the matrix Tom's review checks for completeness):
#   build (Go + libyrs cgo)            -> backend: "Build all Go"
#   backend suite on LIVE Postgres     -> backend: "Backend + full Go suite on live Postgres" (+ skip-guard)
#   regression tag (deterministic + compose E2E) -> regression-e2e
#   installer + release routing contracts -> backend: "Installer and release contract tests"
#   gofmt / vet                        -> backend: "gofmt", "go vet"
#   frontend typecheck + vitest        -> frontend: "Typecheck + vitest"
#   frontend production build          -> frontend: "Production build"
#   git diff --check                   -> diff-check
#   Windows GNU compile/link           -> windows-daemon-build
#   Windows WiX validation + MSI lifecycle -> windows-daemon
#   Windows PowerShell daemon installer -> windows-daemon-installer
#   Windows native runtime tests        -> windows-daemon
#   macOS native cgo + unsigned universal release -> macos-desktop (opt-in until runner capacity exists)
#
# Two meta-properties (Tom's bar):
#   * Fail loud on infrastructure absence — a skipped live-DB suite reporting green is the exact
#     false-assurance class this pipeline exists to kill. The Postgres preflight fails if the DB is
#     unreachable, and the skip-guard fails if the canary live-Postgres test does not actually PASS.
#   * Runner trust — persistent self-hosted runners only execute pushes to branches in this repository.
#     Fork pull requests never trigger this workflow. To test an external contribution, a maintainer
#     must first review it and push the selected commit to a branch in this repository.
#   * Base-freshness — update a branch from main before merging. CI validates the pushed branch head;
#     it deliberately does not execute fork-controlled pull-request merge refs on persistent runners.

name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded branch runs; main is left alone so its history gets a complete gate.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend (build, vet, live-postgres suite, installer)
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: notty_test
          POSTGRES_USER: notty
          POSTGRES_PASSWORD: notty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notty -d notty_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Disposable, isolated live database — matches scripts/test-postgres.sh so the live-DB tests
      # RUN instead of skipping. postgresTestDSN requires the db to be named exactly notty_test.
      NOTTY_DATABASE_TEST_URL: postgres://notty:notty@localhost:5432/notty_test?sslmode=disable
      NOTTY_DATABASE_TEST_ISOLATED: "1"
      # internal/ycrdt's Yjs cross-compat test shells out to `node -e "require('yjs')"`.
      # setup-node provides Node; point it at the frontend's pinned yjs so the test cannot skip.
      NODE_PATH: ${{ github.workspace }}/frontend/node_modules
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # third_party/y-crdt is a submodule; build-yffi needs its source
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # pin to the repo's Go version, not a duplicated literal
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps (provides yjs for the CRDT Yjs cross-compat test)
        run: cd frontend && npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo + libyrs build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            third_party/y-crdt/target
          key: yffi-${{ runner.os }}-${{ hashFiles('third_party/y-crdt/**/Cargo.lock') }}
          restore-keys: |
            yffi-${{ runner.os }}-
      - name: Build libyrs (cgo dependency)
        run: scripts/build-yffi.sh
      - name: gofmt
        run: |
          files="$(git ls-files '*.go' | grep -v '^third_party/')"
          if [ -z "$files" ]; then echo "no Go files to check"; exit 0; fi # avoid gofmt reading stdin
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to run on:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: Preflight — Postgres must be reachable (fail loud, never skip silently)
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U notty -d notty_test >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres service never became ready — refusing to run a suite that would silently skip its live-DB tests"
          exit 1
      - name: Backend + full Go suite on live Postgres
        run: go test -timeout 20m ./...
      - name: Guard — source-contract tests actually ran with package source
        run: |
          out="$(go test -run '^TestSourceContract_' -count=1 -v ./daemon/internal/syncer)"
          echo "$out"
          passes="$(printf '%s\n' "$out" | grep -c -- '^--- PASS: TestSourceContract_' || true)"
          if [ "$passes" -ne 11 ]; then
            echo "::error::source-contract PASS count = $passes, want 11 — a package-source fitness function may be missing or unenforced"; exit 1
          fi
          if echo "$out" | grep -q -- '^--- SKIP: TestSourceContract_'; then
            echo "::error::source-contract test SKIPPED — source-present CI must execute every architectural fitness function"; exit 1
          fi
      - name: Guard — live-Postgres tests actually ran (no silent skip = false green)
        run: |
          out="$(go test -run TestActivitiesSurviveStoreRestartPostgres -count=1 -v ./backend/internal/notty)"
          echo "$out"
          if ! echo "$out" | grep -q -- '--- PASS: TestActivitiesSurviveStoreRestartPostgres'; then
            echo "::error::live-Postgres canary did not PASS — the DB suite may be skipping (false green)"; exit 1
          fi
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "::error::live-Postgres canary SKIPPED — infra absent, this is a false green"; exit 1
          fi
      - name: Guard — Yjs cross-compat test actually ran (CRDT gate must not silently skip)
        run: |
          # The test courtesy-skips when node is absent; in CI a skip means the CRDT-vs-Yjs gate went
          # unenforced. Node/yjs must stay present (see setup-node + NODE_PATH) or this job goes red.
          out="$(go test -run TestYCRDTStickyIndexIsYjsRelativePositionCompatible -count=1 -v ./internal/ycrdt)"
          echo "$out"
          if ! echo "$out" | grep -q -- '--- PASS: TestYCRDTStickyIndexIsYjsRelativePositionCompatible'; then
            echo "::error::Yjs cross-compat test did not PASS — CRDT gate unenforced (node/yjs missing?)"; exit 1
          fi
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "::error::Yjs cross-compat test SKIPPED in CI — the CRDT gate must run, not skip"; exit 1
          fi
      - name: Installer and release contract tests
        run: |
          make daemon-installer-check
          make daemon-uninstall-test
          make build-deploy-contract-check
      - name: Build all Go
        run: go build ./...

  macos-desktop:
    name: macOS desktop native + unsigned release (${{ matrix.architecture }})
    # Keep the complete native matrix checked in, but report it as skipped while
    # this repository has no macOS runner capacity. Set the repository variable
    # CODESK_MACOS_RUNNERS_AVAILABLE=true when capacity is provisioned.
    if: ${{ vars.CODESK_MACOS_RUNNERS_AVAILABLE == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Verify native runner architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"
      - name: Build host libyrs
        run: |
          rm -f third_party/y-crdt/target/release/libyrs.a
          scripts/build-yffi.sh
          cmp third_party/y-crdt/target/release/deps/libyrs.a third_party/y-crdt/target/release/libyrs.a
      - name: Compile and test Darwin cgo composition
        env:
          CGO_ENABLED: "1"
        run: |
          go test -count=1 \
            ./daemon/cmd/codesk-macos-release \
            ./daemon/internal/macosapp \
            ./daemon/internal/macosuser \
            ./daemon/internal/desktopstate \
            ./daemon/internal/desktop \
            ./daemon/internal/desktopapp \
            ./daemon/cmd/codesk-desktop
          go vet \
            ./daemon/cmd/codesk-macos-release \
            ./daemon/internal/macosapp \
            ./daemon/internal/macosuser \
            ./daemon/internal/desktopstate \
            ./daemon/internal/desktop \
            ./daemon/internal/desktopapp \
            ./daemon/cmd/codesk-desktop
          go build -buildvcs=false -o "$RUNNER_TEMP/Codesk-host" ./daemon/cmd/codesk-desktop
      - name: Build and independently verify unsigned universal release
        env:
          ALLOW_UNSIGNED_MACOS_DESKTOP: "1"
        run: |
          rm -rf third_party/y-crdt/target
          release_version="$(scripts/read-daemon-version.sh)"
          scripts/build-macos-desktop-release.sh "$RUNNER_TEMP/macos-release"
          scripts/verify-macos-desktop-release.sh "$RUNNER_TEMP/macos-release/$release_version" "$release_version"
          test "$(plutil -extract signed_and_notarized raw -o - "$RUNNER_TEMP/macos-release/$release_version/manifest.json")" = false
          lipo "$RUNNER_TEMP/macos-release/$release_version/Codesk.app/Contents/MacOS/Codesk" -verify_arch x86_64 arm64
          lipo "$RUNNER_TEMP/macos-release/$release_version/Codesk.app/Contents/Helpers/notty-agent-tool" -verify_arch x86_64 arm64

  windows-daemon-build:
    name: Windows daemon (Zig AMD64 + ARM64 cross-build)
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,aarch64-pc-windows-gnullvm
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip
      - name: Cache cargo + Windows libyrs build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            third_party/y-crdt/target
          key: yffi-windows-zig-cross-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('third_party/y-crdt/**/Cargo.lock') }}
          restore-keys: |
            yffi-windows-zig-cross-${{ runner.os }}-${{ runner.arch }}-
      - name: Build canonical Windows release
        env:
          PLATFORMS: windows/amd64 windows/arm64
        run: scripts/build-daemon-release.sh "$RUNNER_TEMP/notty-release"
      - name: Verify archives, PE machines, manifest, and checksums
        run: |
          release_version="$(scripts/read-daemon-version.sh)"
          go run ./scripts/verify-windows-daemon-release.go "$RUNNER_TEMP/notty-release/$release_version" "$release_version"
      - name: Vet and compile Windows-tagged tests for both architectures
        run: |
          rm -rf "$RUNNER_TEMP/windows-desktop-payload"
          build_version="$(scripts/read-daemon-version.sh)"
          for target in \
            "amd64 x86_64-pc-windows-gnu x86_64-windows-gnu" \
            "arm64 aarch64-pc-windows-gnullvm aarch64-windows-gnu"
          do
            set -- $target
            arch="$1"
            rust_target="$2"
            zig_target="$3"
            payload_dir="$RUNNER_TEMP/windows-desktop-payload/$arch"
            mkdir -p "$payload_dir"
            RUST_TARGET="$rust_target" RUSTFLAGS="-C panic=abort" scripts/build-yffi.sh
            CC="zig cc -target $zig_target" CGO_ENABLED=1 GOOS=windows GOARCH="$arch" \
              go vet ./daemon/internal/syncer ./internal/ycrdt
            CC="zig cc -target $zig_target" CGO_ENABLED=1 GOOS=windows GOARCH="$arch" \
              go test -c -o "$RUNNER_TEMP/notty-syncer-$arch.test.exe" ./daemon/internal/syncer
            CC="zig cc -target $zig_target" CGO_ENABLED=1 GOOS=windows GOARCH="$arch" \
              go vet ./daemon/internal/desktopstate ./daemon/internal/desktop ./daemon/internal/desktopapp ./daemon/cmd/codesk-desktop
            CC="zig cc -target $zig_target" CGO_ENABLED=1 GOOS=windows GOARCH="$arch" \
              go test -c -o "$RUNNER_TEMP/codesk-desktop-$arch.test.exe" ./daemon/cmd/codesk-desktop
            CC="zig cc -target $zig_target" CGO_ENABLED=1 GOOS=windows GOARCH="$arch" \
              go build -trimpath -buildvcs=false \
                -ldflags="-H=windowsgui -extldflags=-Wl,--subsystem,windows -X notty/daemon/internal/buildinfo.Version=$build_version" \
                -o "$payload_dir/Codesk.exe" ./daemon/cmd/codesk-desktop
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" \
              go build -trimpath -buildvcs=false -ldflags="-s -w -X notty/daemon/internal/buildinfo.Version=$build_version" \
                -o "$payload_dir/notty-agent-tool.exe" ./daemon/cmd/agenttool
            go run ./scripts/verify-windows-desktop-pe.go "$payload_dir/Codesk.exe" "$arch" gui
            go run ./scripts/verify-windows-desktop-pe.go "$payload_dir/notty-agent-tool.exe" "$arch" console
          done
      - name: Verify CGO-free desktop state boundary
        run: scripts/test-desktopstate-boundary.sh

  windows-daemon-installer:
    name: Windows daemon installer
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell installer lifecycle
        shell: pwsh
        run: scripts/test-daemon-installer-windows.ps1

  windows-daemon:
    name: Windows daemon (native build + platform tests)
    if: github.ref != 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/windows-native.yml

  regression-e2e:
    name: regression e2e (docker-compose fs<->DB<->daemon sync)
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    env:
      NOTTY_REGRESSION_DEADLINE_SCALE: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # third_party/y-crdt is a submodule; build-yffi needs its source
      - name: Regression stack janitor contract
        run: scripts/test-cleanup-stale-regression-stacks.sh
      - name: Remove stale regression compose projects
        run: scripts/cleanup-stale-regression-stacks.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo + libyrs build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            third_party/y-crdt/target
          key: yffi-${{ runner.os }}-${{ hashFiles('third_party/y-crdt/**/Cargo.lock') }}
          restore-keys: |
            yffi-${{ runner.os }}-
      - name: Build libyrs (cgo dependency)
        run: scripts/build-yffi.sh
      # The regression suite brings up its own postgres + backend via docker compose
      # (test/regression/docker-compose.yml), so no GitHub Postgres service is needed here.
      - name: Full regression suite (docker-compose E2E)
        run: go test -tags=regression -count=1 -timeout 40m ./test/regression

  frontend:
    name: frontend (typecheck, vitest, build)
    runs-on: [self-hosted, Linux, ARM64]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck + vitest
        run: npm test # runs `tsc --noEmit && vitest run`
      - name: Production build
        run: npm run build

  e2e:
    name: e2e (browser core-flow smoke, Playwright vs compose stack)
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # the compose backend image build needs third_party/y-crdt source
      # Validate the teardown contract before running the thing whose teardown it governs — a broken
      # run-smoke.sh that leaks its stack should be caught before it gets the chance to leak one.
      - name: run-smoke teardown contract
        run: ./test-run-smoke-teardown.sh
        working-directory: e2e
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install e2e deps
        run: npm ci
        working-directory: e2e
      - name: Install Playwright chromium (with OS deps)
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      # run-smoke.sh brings up the real compose backend + Postgres, builds the production frontend pointed at
      # it, serves via vite preview, and runs the Playwright smoke — failing loud if any piece of the stack
      # does not come up (never a silent skip). Its seeding uses the compose-exec mark-verified transport.
      - name: Browser core-flow smoke (fail loud if the stack does not come up)
        run: sh run-smoke.sh
        working-directory: e2e

  diff-check:
    name: git diff --check (whitespace / conflict markers)
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: git diff --check against base
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            base="${{ github.event.before }}"
          else
            git fetch --no-tags origin main
            base="$(git merge-base origin/main HEAD)"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "checking diff $base..HEAD"
          git diff --check "$base" HEAD
